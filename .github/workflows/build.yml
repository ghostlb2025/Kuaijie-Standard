name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standard edition
        shell: powershell
        run: .\build.ps1
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: Kuaijie-Standard-Windows-x64
          path: dist/*.zip
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $sourceAsset = Get-ChildItem -LiteralPath dist -Filter '*.zip' |
            Select-Object -First 1
          if (-not $sourceAsset) { throw 'Release ZIP was not found.' }
          $releaseAsset = Join-Path $sourceAsset.DirectoryName `
            'Kuaijie-Standard-Windows-x64.zip'
          Copy-Item -LiteralPath $sourceAsset.FullName -Destination $releaseAsset -Force

          if ($env:GITHUB_REF_NAME -eq 'v1.2.0') {
            $oldRelease = gh api `
              "repos/$env:GH_REPO/releases/tags/v1.1.0" | ConvertFrom-Json
            gh release edit v1.1.0 `
              --title '快截标准版 v1.1.0' `
              --notes-file '.github/release-notes/v1.1.0.md' `
              --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Could not repair v1.1.0 metadata.' }
            if ($oldRelease.assets.Count -gt 0) {
              gh api --method PATCH `
                "repos/$env:GH_REPO/releases/assets/$($oldRelease.assets[0].id)" `
                -f name='Kuaijie-Standard-v1.1.0-Windows-x64.zip' `
                -f label='Windows x64 portable ZIP' | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'Could not rename the v1.1.0 asset.' }
            }
          }

          gh release create $env:GITHUB_REF_NAME $releaseAsset `
            --title "快截标准版 $env:GITHUB_REF_NAME" `
            --notes-file 'RELEASE_NOTES.md' `
            --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the tagged release.' }
